plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tirai.pilot'
    compileSdk 36

    defaultConfig {
        applicationId 'com.tirai.pilot'
        minSdk 31
        targetSdk 36
        versionCode 1
        versionName '0.1.0-prototype'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
